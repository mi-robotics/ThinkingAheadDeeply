# mem-hvla: HVLA recurrent decoder over Zeng et al.'s double-encoder CLS tokens. REQUIRES
#   RDVLA_IMAGE_HISTORY=10 RDVLA_HIST_VIT=memhvla RDVLA_ENCODER_LR_SCALE=0.1 RDVLA_EMA=1 RDVLA_RAM_CACHE=encoded
# (scripts/train.sh --preset memhvla sets them). 96% on LIBERO-Object at 1 action/query, 25k steps, 1 seed (2026-11-04).
# LIBERO-spatial. Effective batch 32 (8 x 4 accumulation fits a 24 GB GPU), 50000 steps, lr 5e-5, LoRA r64 on the VLM.
# Seed and output dir are set by scripts/train.sh (--seed / --out); these values are the defaults.
action_head:
  type: hvla
  recurrent:
    hidden_dim: 896
    num_heads: 8
    prelude_vlm_layers: [11]        # lengths only: 1 prelude, 2 core, 1 coda layer
    recurrent_vlm_layers: [23, 23]
    coda_vlm_layers: [23]
    action_chunk_len: 8
    action_dim: 7
    rms_norm_eps: 1.0e-06
    rope_base: 10000.0
    mean_recurrence: 32
    backprop_depth: 8
    random_iterations: true
    init_std: 0.632
    state_init_std: 3.8
    s1_encoder_layers: 4
    s1_context_layer: 23
    s1_vit_model: vit_small_patch14_dinov2.lvd142m
    s1_vit_pretrained: true
    s1_num_images: 2
    s1_s2_refresh_every: 8
model:
  use_lora: true
  lora_rank: 64
optimizer:
  learning_rate: 5.0e-05
data:
  data_root_dir: datasets/libero
  dataset_name: libero_spatial_no_noops
  image_aug: true
  shuffle_buffer_size: 30000
batch_size: 8
grad_accumulation_steps: 4
max_steps: 50000
save_freq: 10000
save_latest_only: false
merge_lora: true
seed: 42
use_wandb: false
run_name: memhvla_spatial
output_dir: outputs/libero/memhvla/spatial/seed42
